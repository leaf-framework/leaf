# Define stages of the pipeline
stages:
  - lint
  - test
  - publish
  - package
  - release

variables:
  GIT_DEPTH: 0  # Full history
  # Parallel test isolation settings
  PYTEST_ADDOPTS: "--forked --dist=loadscope --tb=short"
  # Prevent Redis conflicts in parallel execution
  REDIS_URL: "redis://localhost:6379"
  # Use temporary directories for test isolation
  TMPDIR: "/tmp"

# Job to run linting
# TEMPORARILY DISABLED while iterating rapidly on the Windows/macOS
# packaging pipeline -- remove this `rules: when: never` (restoring the
# tag-skip rules below it in git history) once packaging is stable again.
lint:
  stage: lint
  image: python:3.12
  rules:
    - when: never
  before_script:
    - pip install ruff
  script:
    - ruff check leaf/ tests/
    - ruff format --check leaf/ tests/

# Job to run tests
# TEMPORARILY DISABLED -- see lint's comment above.
test:
  stage: test
  image: registry.gitlab.com/leaf-framework/leaf:runner
  rules:
    - when: never
  before_script:
    - mosquitto -d
    - redis-server --daemonize yes
    - source /venv/bin/activate
    - poetry lock
    - poetry install --with test,dev
  script:
    # Run tests with parallel execution but better isolation
    # Use -n auto for parallel execution, --forked for test isolation
    # loadscope distribution groups tests by module to reduce file watcher conflicts
    # -v shows test names as they run, --maxfail=5 stops after 5 failures
    - poetry run pytest -n auto --forked tests/ --maxfail=5 -v
      --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml
      --cov-report=html:htmlcov --junitxml=test-reports/report.xml

  artifacts:
    when: always
    reports:
      junit: test-reports/*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - test-reports/
      - htmlcov/
      - coverage.xml
  timeout: 30m  # Extended timeout for file watcher tests with longer wait times


publish:
  stage: publish
  image: python:3.12
  before_script:
    - pip install poetry
    - poetry config virtualenvs.create false
    - poetry config pypi-token.pypi "$PYPI_TOKEN"
  script:
    # Highest semver tag, not nearest-ancestor tag (git describe --abbrev=0
    # picks by commit-graph distance, which breaks if a tag ever gets
    # created on a commit behind an already-tagged one).
    - git fetch --tags --force
    - latest_tag=$(git tag --list 'v*' | sort -V | tail -n1)
    - base_version=${latest_tag#v}
    - major=$(echo $base_version | cut -d. -f1)
    - minor=$(echo $base_version | cut -d. -f2)
    - patch=$(echo $base_version | cut -d. -f3)
    - patch=${patch:-0}
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        new_patch=$((patch + 1))
        new_version="${major}.${minor}.${new_patch}"
        # Tag the release via GitLab API so dev builds count commits from this
        # point. Tag is the full MAJOR.MINOR.PATCH version, not just
        # MAJOR.MINOR -- matters because packaging/'s installer pipeline
        # triggers off any tag and derives its own version from the tag name;
        # a mismatched format here previously caused duplicate releases.
        curl --silent --fail --request POST \
          --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          --data "tag_name=v${new_version}&ref=${CI_COMMIT_SHA}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags"
      else
        commit_count=$(git rev-list ${latest_tag}..HEAD --count)
        new_version="${base_version}.${commit_count}"
      fi
    - echo "New version $new_version"
    # update version in pyproject.toml without committing or tagging
    - sed -i -E "s/^(version\s*=\s*\")0\.0\.0(\".*)$/\1${new_version}\2/" pyproject.toml
    - head -n 10 pyproject.toml
    # And publish
    - poetry build
    - ls -l dist/
    - poetry publish
  only:
    - main
    - dev

# --- Desktop installers -----------------------------------------------------
# Runs only on the tag pipeline that `publish` triggers when it releases from
# main (the API call above creates tag vMAJOR.MINOR, which fires a fresh
# pipeline for that tag). Needs self-hosted runners tagged `macos` / `windows`
# -- see packaging/README.md for what each machine needs installed
# (PyInstaller comes from pip; Windows also needs Inno Setup's ISCC.exe).

# publish tags as vMAJOR.MINOR but pyproject/PyPI use MAJOR.MINOR.0 -- pad it
# here once so both packaging jobs and the release job agree on one version.
determine_version:
  stage: package
  image: python:3.12
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      tag_version="${CI_COMMIT_TAG#v}"
      case "$tag_version" in
        *.*.*) leaf_version="$tag_version" ;;
        *) leaf_version="${tag_version}.0" ;;
      esac
      echo "LEAF_VERSION=$leaf_version" | tee build.env
  artifacts:
    reports:
      dotenv: build.env

package:macos:
  stage: package
  tags:
    - macos
  needs:
    - determine_version
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    # PyInstaller is installed inside build_dmg.sh itself, into whichever
    # python3 it picks (see there for why bare `python3` isn't trusted).
    - packaging/macos/build_dmg.sh "leaf-framework==${LEAF_VERSION}"
    - |
      asset_name="LEAF-macos-$(uname -m).dmg"
      echo "MACOS_ASSET_NAME=$asset_name" | tee macos_asset.env
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/${asset_name}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/leaf-desktop/${LEAF_VERSION}/${asset_name}"
  artifacts:
    paths:
      - dist/*.dmg
    reports:
      dotenv: macos_asset.env
    expire_in: 30 days

# Unlike macOS/Windows, a Linux build needs nothing native -- it's just an
# ELF binary, so it runs in a plain Docker image on the shared runner, same
# as lint/test/determine_version. Built on Debian bullseye (glibc 2.31)
# rather than a newer image for broader distro compatibility.
package:linux:
  stage: package
  image: python:3.12-slim-bullseye
  needs:
    - determine_version
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq python3-tk tk8.6 curl binutils file > /dev/null
  script:
    - packaging/linux/build_appimage.sh "leaf-framework==${LEAF_VERSION}"
    - |
      asset_name="LEAF-linux-$(uname -m).AppImage"
      echo "LINUX_ASSET_NAME=$asset_name" | tee linux_asset.env
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/${asset_name}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/leaf-desktop/${LEAF_VERSION}/${asset_name}"
  artifacts:
    paths:
      - dist/*.AppImage
    reports:
      dotenv: linux_asset.env
    expire_in: 30 days

# Same build, on a linux-arm64-tagged runner (Docker Desktop on Apple
# Silicon runs arm64 Linux containers natively -- no cross-arch emulation
# needed, unlike trying to build this on an x86_64 runner). Separate
# dotenv variable name (LINUX_ARM64_ASSET_NAME) so its artifact doesn't
# collide with package:linux's LINUX_ASSET_NAME when release needs both.
package:linux:arm64:
  stage: package
  image: python:3.12-slim-bullseye
  tags:
    - linux-arm64
  needs:
    - determine_version
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq python3-tk tk8.6 curl binutils file > /dev/null
  script:
    - packaging/linux/build_appimage.sh "leaf-framework==${LEAF_VERSION}"
    - |
      asset_name="LEAF-linux-$(uname -m).AppImage"
      echo "LINUX_ARM64_ASSET_NAME=$asset_name" | tee linux_arm64_asset.env
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/${asset_name}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/leaf-desktop/${LEAF_VERSION}/${asset_name}"
  artifacts:
    paths:
      - dist/*.AppImage
    reports:
      dotenv: linux_arm64_asset.env
    expire_in: 30 days

# Assumes a PowerShell-shell Windows runner with Inno Setup pre-installed.
# Python/ISCC discovery lives in packaging/windows/find_python.ps1 and
# find_iscc.ps1 (see those for the full reasoning) -- shared with
# package:windows:arm64 below rather than duplicated inline per arch.
#
# Gated on $WINDOWS_RUNNER_READY (set to "true" as a project/group CI/CD
# variable once a `windows`-tagged runner actually exists) so this job isn't
# even created in the pipeline until then -- otherwise it sits pending
# forever with no runner to pick it up, and blocks `release` behind it.
package:windows:
  stage: package
  tags:
    - windows
  needs:
    - determine_version
  rules:
    - if: '$CI_COMMIT_TAG && $WINDOWS_RUNNER_READY == "true"'
  script:
    - |
      $goodPython = packaging/windows/find_python.ps1 -Arch amd64
      Write-Host "Using AMD64 python at $goodPython"
      & $goodPython -m pip install "pyinstaller~=6.19"
      & $goodPython -m PyInstaller packaging/launcher/leaf_launcher.spec --distpath dist --workpath build/launcher --noconfirm
      & $goodPython packaging/runtime/fetch_python.py windows-amd64 --out dist/LEAF
      Set-Content -Path dist/LEAF/leaf-framework.version -Value "leaf-framework==$env:LEAF_VERSION" -Encoding ascii
      & $goodPython packaging/runtime/build_wheelhouse.py --runtime-archive dist/LEAF/python-runtime-windows-amd64.tar.gz --requirement "leaf-framework==$env:LEAF_VERSION" --out build/wheelhouse-staging
    - tar czf dist/LEAF/wheelhouse.tar.gz -C build/wheelhouse-staging .
    - |
      $isccPath = packaging/windows/find_iscc.ps1
      Write-Host "Using ISCC at $isccPath"
      # Arch-tagged output filename, matching macOS/Linux's LEAF-<os>-<arch>
      # convention -- not just cosmetic: without it, a second Windows arch
      # build would silently overwrite this release asset.
      $env:LEAF_WIN_ARCH = "amd64"
      & $isccPath packaging/windows/leaf.iss
    - |
      curl --fail --header "JOB-TOKEN: $env:CI_JOB_TOKEN" `
        --upload-file "packaging/windows/Output/LEAF-Setup-amd64.exe" `
        "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/leaf-desktop/$env:LEAF_VERSION/LEAF-Setup-amd64.exe"
  artifacts:
    paths:
      - packaging/windows/Output/LEAF-Setup-amd64.exe
    expire_in: 30 days

# Same build, targeting arm64 instead -- this runner's own hardware IS
# ARM64 (Windows-on-ARM under UTM on Apple Silicon), so this one builds
# natively with no emulation involved, unlike package:windows above.
package:windows:arm64:
  stage: package
  tags:
    - windows
  needs:
    - determine_version
  rules:
    - if: '$CI_COMMIT_TAG && $WINDOWS_RUNNER_READY == "true"'
  script:
    - |
      $goodPython = packaging/windows/find_python.ps1 -Arch arm64
      Write-Host "Using ARM64 python at $goodPython"
      & $goodPython -m pip install "pyinstaller~=6.19"
      & $goodPython -m PyInstaller packaging/launcher/leaf_launcher.spec --distpath dist --workpath build/launcher --noconfirm
      & $goodPython packaging/runtime/fetch_python.py windows-arm64 --out dist/LEAF
      Set-Content -Path dist/LEAF/leaf-framework.version -Value "leaf-framework==$env:LEAF_VERSION" -Encoding ascii
      # A few dependencies (e.g. httptools) have no prebuilt win_arm64 wheel
      # on PyPI -- build_wheelhouse.py compiles them from source itself in
      # that case, which needs a C compiler on PATH. Activate the VS Build
      # Tools ARM64 dev shell for the rest of this job so that's available.
      # -SkipAutomaticLocation: Enter-VsDevShell otherwise cd's away from
      # the repo checkout, breaking the relative paths used below.
      $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
      $vsPath = & $vswhere -latest -products * -property installationPath
      Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
      Enter-VsDevShell -VsInstallPath $vsPath -DevCmdArguments "-arch=arm64 -host_arch=arm64" -SkipAutomaticLocation
      & $goodPython packaging/runtime/build_wheelhouse.py --runtime-archive dist/LEAF/python-runtime-windows-arm64.tar.gz --requirement "leaf-framework==$env:LEAF_VERSION" --out build/wheelhouse-staging-arm64
    - tar czf dist/LEAF/wheelhouse.tar.gz -C build/wheelhouse-staging-arm64 .
    - |
      $isccPath = packaging/windows/find_iscc.ps1
      Write-Host "Using ISCC at $isccPath"
      $env:LEAF_WIN_ARCH = "arm64"
      & $isccPath packaging/windows/leaf.iss
    - |
      curl --fail --header "JOB-TOKEN: $env:CI_JOB_TOKEN" `
        --upload-file "packaging/windows/Output/LEAF-Setup-arm64.exe" `
        "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/leaf-desktop/$env:LEAF_VERSION/LEAF-Setup-arm64.exe"
  artifacts:
    paths:
      - packaging/windows/Output/LEAF-Setup-arm64.exe
    expire_in: 30 days

# Depends on package:macos and package:linux (both need no special runner
# setup) but not package:windows, so the release goes out even before a
# Windows runner exists -- no dead link to an installer that was never
# built, and nothing here ever blocks on package:windows being stuck.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - determine_version
    - package:macos
    - package:linux
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Creating GitLab release for $LEAF_VERSION"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'LEAF $LEAF_VERSION'
    description: 'Desktop installers for LEAF $LEAF_VERSION'
    assets:
      links:
        - name: 'macOS installer (arm64, .dmg)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/leaf-desktop/${LEAF_VERSION}/${MACOS_ASSET_NAME}'
        - name: 'Linux AppImage (x86_64)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/leaf-desktop/${LEAF_VERSION}/${LINUX_ASSET_NAME}'

# Adds the Windows asset link to the already-created release, once a real
# Windows runner exists (see package:windows above for the same gate).
release:windows-asset:
  stage: release
  image: alpine:latest
  needs:
    - determine_version
    - package:windows
    - release
  rules:
    - if: '$CI_COMMIT_TAG && $WINDOWS_RUNNER_READY == "true"'
  script:
    - apk add --no-cache curl
    - |
      curl --fail --request POST --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        --data "name=Windows installer (amd64, .exe)" \
        --data "url=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/leaf-desktop/${LEAF_VERSION}/LEAF-Setup-amd64.exe" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"

# Adds the Windows arm64 asset link, same gate as windows-asset above.
release:windows-arm64-asset:
  stage: release
  image: alpine:latest
  needs:
    - determine_version
    - package:windows:arm64
    - release
  rules:
    - if: '$CI_COMMIT_TAG && $WINDOWS_RUNNER_READY == "true"'
  script:
    - apk add --no-cache curl
    - |
      curl --fail --request POST --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        --data "name=Windows installer (arm64, .exe)" \
        --data "url=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/leaf-desktop/${LEAF_VERSION}/LEAF-Setup-arm64.exe" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"

# Adds the Linux arm64 asset link to the already-created release. Not in
# release's own `needs` (same reasoning as windows-asset above): a hiccup
# on this newer runner shouldn't hold back macOS/Linux-x86_64/Windows,
# which need no special runner setup and are ready sooner.
release:linux-arm64-asset:
  stage: release
  image: alpine:latest
  needs:
    - determine_version
    - package:linux:arm64
    - release
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - apk add --no-cache curl
    - |
      curl --fail --request POST --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        --data "name=Linux AppImage (aarch64)" \
        --data "url=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/leaf-desktop/${LEAF_VERSION}/${LINUX_ARM64_ASSET_NAME}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"
