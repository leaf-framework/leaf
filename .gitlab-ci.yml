# Define stages of the pipeline
stages:
  - lint
  - test
  - publish
  - verify
  - package
  - release

variables:
  GIT_DEPTH: 0  # Full history
  # Parallel test isolation settings
  PYTEST_ADDOPTS: "--forked --dist=loadscope --tb=short"
  # Prevent Redis conflicts in parallel execution
  REDIS_URL: "redis://localhost:6379"
  # Use temporary directories for test isolation
  TMPDIR: "/tmp"

# Job to run linting
lint:
  stage: lint
  image: python:3.12
  before_script:
    - pip install ruff
  script:
    - ruff check leaf/ tests/
    - ruff format --check leaf/ tests/

# Job to run tests
test:
  stage: test
  image: registry.gitlab.com/leaf-framework/leaf:runner
  before_script:
    - mosquitto -d
    - redis-server --daemonize yes
    - source /venv/bin/activate
    - poetry install --with test,dev
    # leaf-example is normally installed by end users via the UI marketplace
    # (see leaf/ui/tabs/adapters.py), not bundled as a project dependency.
    # tests/static_files/test_config_keydb.yaml exercises it though, so pull
    # it in here. --no-deps because its own leaf-framework>=0.10.0 pin can't
    # resolve against this checkout's dev placeholder version (0.0.0) - the
    # leaf-framework already installed via this editable checkout satisfies
    # it at runtime regardless of the declared version number.
    - pip install --no-deps "git+https://gitlab.com/leaf-framework/leaf-adapters/leaf-example.git"
  script:
    # Run tests with parallel execution but better isolation
    # Use -n auto for parallel execution, --forked for test isolation
    # loadscope distribution groups tests by module to reduce file watcher conflicts
    # -v shows test names as they run, --maxfail=5 stops after 5 failures
    #
    # No --cov here on purpose: pytest-forked's per-test os._exit() skips
    # coverage.py's exit-save hook, so a --forked run only ever captured
    # ~20% "coverage" regardless of what actually ran (measured: 21.4%
    # reported vs ~62% real, confirmed by rerunning the same suite without
    # --forked). See the `coverage` job below for the real number.
    - poetry run pytest -n auto --forked tests/ --maxfail=5 -v -m "not marketplace"
      --junitxml=test-reports/report.xml

  artifacts:
    when: always
    reports:
      junit: test-reports/*.xml
    paths:
      - test-reports/
  timeout: 30m  # Extended timeout for file watcher tests with longer wait times

# Same suite as `test`, minus --forked, so coverage.py can actually see what
# ran. --forked stays in `test` because it's load-bearing: without it,
# test_parallel_does_not_affect_primary_return and test_fallback_keydb fail
# on shared Redis/keydb state leaking between tests (exactly what per-test
# process isolation is for) - not something this job should paper over.
# allow_failure is set because those two failures are therefore expected
# here; this job exists to publish an accurate coverage number, not to gate
# correctness (that's still `test`'s job).
coverage:
  stage: test
  image: registry.gitlab.com/leaf-framework/leaf:runner
  allow_failure: true
  variables:
    # Overrides the global PYTEST_ADDOPTS (which injects --forked into every
    # job) - the whole point of this job is running without --forked.
    PYTEST_ADDOPTS: "--dist=loadscope --tb=short"
  before_script:
    - mosquitto -d
    - redis-server --daemonize yes
    - source /venv/bin/activate
    - poetry install --with test,dev
    - pip install --no-deps "git+https://gitlab.com/leaf-framework/leaf-adapters/leaf-example.git"
  script:
    - poetry run pytest -n auto --dist=loadscope tests/ -v -m "not marketplace"
      --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml
      --cov-report=html:htmlcov --junitxml=test-reports/coverage-report.xml
  artifacts:
    when: always
    reports:
      junit: test-reports/coverage-report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - test-reports/
      - htmlcov/
      - coverage.xml
  timeout: 30m


# The version is derived from the tag, once, here -- every downstream job
# (packaging, release, cleanup) reads LEAF_VERSION from this dotenv rather
# than re-parsing $CI_COMMIT_TAG, so they can never disagree. A vMAJOR.MINOR
# tag is padded to MAJOR.MINOR.0 because pyproject/PyPI want three segments.
#
# The tag is typed by a human, so this job also vets it before anything
# irreversible happens -- it runs first in the pipeline's first tag-only
# stage, so a bad tag costs one fast failed job and nothing else. See the
# checks in check_tag.py for what "bad" means and why.
determine_version:
  stage: publish
  image: python:3.12
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      tag_version="${CI_COMMIT_TAG#v}"
      case "$tag_version" in
        *.*.*) leaf_version="$tag_version" ;;
        *) leaf_version="${tag_version}.0" ;;
      esac
    # Tags aren't fetched by a tag-pipeline checkout, and the highest-in-line
    # check below needs the full list.
    - git fetch --tags --force --quiet
    - python ci/check_tag.py "$CI_COMMIT_TAG" "$leaf_version"
    # Written only after the checks pass, so a rejected tag produces no
    # dotenv and every downstream job is skipped rather than running with a
    # version nobody vetted.
    - echo "LEAF_VERSION=$leaf_version" | tee build.env
  artifacts:
    reports:
      dotenv: build.env

# Releases are deliberate: merging to main publishes nothing. You cut a
# release by creating the tag -- `git tag v0.11.0 && git push origin v0.11.0`,
# or Repository > Tags > New tag in the UI -- and this job ships exactly that
# version. Runs in the same pipeline as the packaging jobs below (which
# `needs:` it), so an installer can never try to pip-install a version that
# isn't on PyPI yet; lint and test have no rules, so they gate this too.
publish:
  stage: publish
  image: python:3.12
  needs:
    - determine_version
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - pip install poetry
    - poetry config virtualenvs.create false
    - poetry config pypi-token.pypi "$PYPI_TOKEN"
  script:
    - echo "Publishing $LEAF_VERSION from tag $CI_COMMIT_TAG"
    # pyproject.toml keeps a 0.0.0 placeholder in git -- the tag is the single
    # source of truth, so the real version is stamped in at build time only
    # and never committed.
    - sed -i -E "s/^(version\s*=\s*\")0\.0\.0(\".*)$/\1${LEAF_VERSION}\2/" pyproject.toml
    - head -n 10 pyproject.toml
    - poetry build
    - ls -l dist/
    - poetry publish

verify-marketplace:
  stage: verify
  image: python:3.12
  allow_failure: true
  variables:
    PYTEST_ADDOPTS: "--tb=short"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install pytest pytest-forked pytest-xdist pytest-timeout pyyaml
  script:
    - pytest tests/test_marketplace_install.py -v -m marketplace
      --junitxml=marketplace-report.xml
  artifacts:
    when: always
    reports:
      junit: marketplace-report.xml
  only:
    - main
    - tags

# --- Desktop installers -----------------------------------------------------
# Runs only on tag pipelines, after `publish` has put the wheel on PyPI --
# these builds pip-install leaf-framework==$LEAF_VERSION from there, hence the
# `needs: publish`. Needs self-hosted runners tagged `macos` / `windows`
# -- see packaging/README.md for what each machine needs installed
# (PyInstaller comes from pip; Windows also needs Inno Setup's ISCC.exe).

package:macos:
  stage: package
  tags:
    - macos
  needs:
    - determine_version
    - publish
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    # PyInstaller is installed inside build_dmg.sh itself, into whichever
    # python3 it picks (see there for why bare `python3` isn't trusted).
    - packaging/macos/build_dmg.sh "leaf-framework==${LEAF_VERSION}"
    - |
      asset_name="LEAF-macos-$(uname -m).dmg"
      echo "MACOS_ASSET_NAME=$asset_name" | tee macos_asset.env
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/${asset_name}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/leaf-desktop/${LEAF_VERSION}/${asset_name}"
  # No binary artifact on purpose: the installer is already uploaded to the
  # generic package registry above, which is the permanent copy the release
  # asset links point at. Keeping a second 30-day copy here duplicated every
  # installer for no consumer - nothing downstream reads dist/ (release and
  # the release:*-asset jobs use only the dotenv variables below).
  artifacts:
    reports:
      dotenv: macos_asset.env

# Unlike macOS/Windows, a Linux build needs nothing native -- it's just an
# ELF binary, so it runs in a plain Docker image on the shared runner, same
# as lint/test/determine_version. Built on Debian bullseye (glibc 2.31)
# rather than a newer image for broader distro compatibility.
package:linux:
  stage: package
  image: python:3.12-slim-bullseye
  # Pinned to an amd64 runner; an untagged arm64 runner once built this.
  tags:
    - amd64
  needs:
    - determine_version
    - publish
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    # Bullseye has moved to archive.debian.org; deb.debian.org now 404s on it.
    - sed -i -e 's|http://deb.debian.org|http://archive.debian.org|' /etc/apt/sources.list
    - apt-get update -qq
    - apt-get install -y -qq python3-tk tk8.6 curl binutils file > /dev/null
  script:
    - packaging/linux/build_appimage.sh "leaf-framework==${LEAF_VERSION}"
    - |
      asset_name="LEAF-linux-$(uname -m).AppImage"
      echo "LINUX_ASSET_NAME=$asset_name" | tee linux_asset.env
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/${asset_name}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/leaf-desktop/${LEAF_VERSION}/${asset_name}"
  # No binary artifact on purpose: the installer is already uploaded to the
  # generic package registry above, which is the permanent copy the release
  # asset links point at. Keeping a second 30-day copy here duplicated every
  # installer for no consumer - nothing downstream reads dist/ (release and
  # the release:*-asset jobs use only the dotenv variables below).
  artifacts:
    reports:
      dotenv: linux_asset.env

# Same build, on a linux-arm64-tagged runner (Docker Desktop on Apple
# Silicon runs arm64 Linux containers natively -- no cross-arch emulation
# needed, unlike trying to build this on an x86_64 runner). Separate
# dotenv variable name (LINUX_ARM64_ASSET_NAME) so its artifact doesn't
# collide with package:linux's LINUX_ASSET_NAME when release needs both.
package:linux:arm64:
  stage: package
  image: python:3.12-slim-bullseye
  tags:
    - linux-arm64
  needs:
    - determine_version
    - publish
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    # Bullseye has moved to archive.debian.org; deb.debian.org now 404s on it.
    - sed -i -e 's|http://deb.debian.org|http://archive.debian.org|' /etc/apt/sources.list
    - apt-get update -qq
    - apt-get install -y -qq python3-tk tk8.6 curl binutils file > /dev/null
  script:
    - packaging/linux/build_appimage.sh "leaf-framework==${LEAF_VERSION}"
    - |
      asset_name="LEAF-linux-$(uname -m).AppImage"
      echo "LINUX_ARM64_ASSET_NAME=$asset_name" | tee linux_arm64_asset.env
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/${asset_name}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/leaf-desktop/${LEAF_VERSION}/${asset_name}"
  # No binary artifact on purpose: the installer is already uploaded to the
  # generic package registry above, which is the permanent copy the release
  # asset links point at. Keeping a second 30-day copy here duplicated every
  # installer for no consumer - nothing downstream reads dist/ (release and
  # the release:*-asset jobs use only the dotenv variables below).
  artifacts:
    reports:
      dotenv: linux_arm64_asset.env

# Code signing for the Windows jobs, with UNLOCK's Azure Artifact Signing
# certificate (see packaging/windows/sign.ps1). The ID token is exchanged
# for managed identity euw-id-sign-unlock-p, which trusts only tag
# pipelines of this project; v* tags are protected to maintainers.
.windows-signing:
  id_tokens:
    AZURE_ID_TOKEN:
      aud: api://AzureADTokenExchange
  variables:
    AZURE_TENANT_ID: "27d137e5-761f-4dc1-af88-d26430abb18f"
    AZURE_CLIENT_ID: "63a1f847-3d10-4ad3-b6de-d91d2fd1b1c1"
    LEAF_SIGN: "true"

# Assumes a PowerShell-shell Windows runner with Inno Setup pre-installed.
# Python/ISCC discovery lives in packaging/windows/find_python.ps1 and
# find_iscc.ps1 (see those for the full reasoning) -- shared with
# package:windows:arm64 below rather than duplicated inline per arch.
#
# Gated on $WINDOWS_RUNNER_READY (set to "true" as a project/group CI/CD
# variable once a `windows`-tagged runner actually exists) so this job isn't
# even created in the pipeline until then -- otherwise it sits pending
# forever with no runner to pick it up, and blocks `release` behind it.
package:windows:
  extends: .windows-signing
  stage: package
  tags:
    - windows-amd64
  needs:
    - determine_version
    - publish
  rules:
    - if: '$CI_COMMIT_TAG && $WINDOWS_RUNNER_READY == "true"'
  script:
    - |
      $goodPython = packaging/windows/find_python.ps1 -Arch amd64
      Write-Host "Using AMD64 python at $goodPython"
      & $goodPython -m pip install "pyinstaller~=6.19"
      & $goodPython -m PyInstaller packaging/launcher/leaf_launcher.spec --distpath dist --workpath build/launcher --noconfirm
      & $goodPython packaging/runtime/fetch_python.py windows-amd64 --out dist/LEAF
      Set-Content -Path dist/LEAF/leaf-framework.version -Value "leaf-framework==$env:LEAF_VERSION" -Encoding ascii
      & $goodPython packaging/runtime/build_wheelhouse.py --runtime-archive dist/LEAF/python-runtime-windows-amd64.tar.gz --requirement "leaf-framework==$env:LEAF_VERSION" --out build/wheelhouse-staging
    - tar czf dist/LEAF/wheelhouse.tar.gz -C build/wheelhouse-staging .
    - packaging/windows/sign.ps1 dist/LEAF/LEAF.exe
    - |
      $isccPath = packaging/windows/find_iscc.ps1
      Write-Host "Using ISCC at $isccPath"
      # Arch-tagged output filename, matching macOS/Linux's LEAF-<os>-<arch>
      # convention -- not just cosmetic: without it, a second Windows arch
      # build would silently overwrite this release asset.
      $env:LEAF_WIN_ARCH = "amd64"
      # Inno calls this for the setup and its uninstaller; $q and $f are
      # its placeholders for a quote and the file to sign.
      $signScript = (Resolve-Path packaging/windows/sign.ps1).Path
      & $isccPath "/Sleafsign=powershell.exe -NoProfile -ExecutionPolicy Bypass -File `$q$signScript`$q `$f" packaging/windows/leaf.iss
    - |
      curl --fail --header "JOB-TOKEN: $env:CI_JOB_TOKEN" `
        --upload-file "packaging/windows/Output/LEAF-Setup-amd64.exe" `
        "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/leaf-desktop/$env:LEAF_VERSION/LEAF-Setup-amd64.exe"
  # No binary artifact on purpose: the installer is already uploaded to the
  # generic package registry above, which is the permanent copy the release
  # asset links point at. Keeping a second 30-day copy here duplicated every
  # installer for no consumer - nothing downstream reads dist/ (release and
  # the release:*-asset jobs use only the dotenv variables below).

# Same build, targeting arm64 instead. Needs a native Windows-on-ARM
# runner (tag windows-arm64), so it has its own gate,
# $WINDOWS_ARM64_RUNNER_READY; the amd64 runner (tag windows-amd64) is
# an x64 VM that can't run ARM64 Python or compilers.
package:windows:arm64:
  extends: .windows-signing
  stage: package
  tags:
    - windows-arm64
  needs:
    - determine_version
    - publish
  rules:
    - if: '$CI_COMMIT_TAG && $WINDOWS_ARM64_RUNNER_READY == "true"'
  script:
    - |
      $goodPython = packaging/windows/find_python.ps1 -Arch arm64
      Write-Host "Using ARM64 python at $goodPython"
      & $goodPython -m pip install "pyinstaller~=6.19"
      & $goodPython -m PyInstaller packaging/launcher/leaf_launcher.spec --distpath dist --workpath build/launcher --noconfirm
      & $goodPython packaging/runtime/fetch_python.py windows-arm64 --out dist/LEAF
      Set-Content -Path dist/LEAF/leaf-framework.version -Value "leaf-framework==$env:LEAF_VERSION" -Encoding ascii
      # A few dependencies (e.g. httptools) have no prebuilt win_arm64 wheel
      # on PyPI -- build_wheelhouse.py compiles them from source itself in
      # that case, which needs a C compiler on PATH. Activate the VS Build
      # Tools ARM64 dev shell for the rest of this job so that's available.
      # -SkipAutomaticLocation: Enter-VsDevShell otherwise cd's away from
      # the repo checkout, breaking the relative paths used below.
      $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
      $vsPath = & $vswhere -latest -products * -property installationPath
      Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
      Enter-VsDevShell -VsInstallPath $vsPath -DevCmdArguments "-arch=arm64 -host_arch=arm64" -SkipAutomaticLocation
      & $goodPython packaging/runtime/build_wheelhouse.py --runtime-archive dist/LEAF/python-runtime-windows-arm64.tar.gz --requirement "leaf-framework==$env:LEAF_VERSION" --out build/wheelhouse-staging-arm64
    - tar czf dist/LEAF/wheelhouse.tar.gz -C build/wheelhouse-staging-arm64 .
    - packaging/windows/sign.ps1 dist/LEAF/LEAF.exe
    - |
      $isccPath = packaging/windows/find_iscc.ps1
      Write-Host "Using ISCC at $isccPath"
      $env:LEAF_WIN_ARCH = "arm64"
      # Inno calls this for the setup and its uninstaller; $q and $f are
      # its placeholders for a quote and the file to sign.
      $signScript = (Resolve-Path packaging/windows/sign.ps1).Path
      & $isccPath "/Sleafsign=powershell.exe -NoProfile -ExecutionPolicy Bypass -File `$q$signScript`$q `$f" packaging/windows/leaf.iss
    - |
      curl --fail --header "JOB-TOKEN: $env:CI_JOB_TOKEN" `
        --upload-file "packaging/windows/Output/LEAF-Setup-arm64.exe" `
        "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/leaf-desktop/$env:LEAF_VERSION/LEAF-Setup-arm64.exe"
  # No binary artifact on purpose: the installer is already uploaded to the
  # generic package registry above, which is the permanent copy the release
  # asset links point at. Keeping a second 30-day copy here duplicated every
  # installer for no consumer - nothing downstream reads dist/ (release and
  # the release:*-asset jobs use only the dotenv variables below).

# Depends on package:macos and package:linux (both need no special runner
# setup) but not package:windows, so the release goes out even before a
# Windows runner exists -- no dead link to an installer that was never
# built, and nothing here ever blocks on package:windows being stuck.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - determine_version
    - package:macos
    - package:linux
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Creating GitLab release for $LEAF_VERSION"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'LEAF $LEAF_VERSION'
    description: 'Desktop installers for LEAF $LEAF_VERSION'
    assets:
      links:
        - name: 'macOS installer (arm64, .dmg)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/leaf-desktop/${LEAF_VERSION}/${MACOS_ASSET_NAME}'
        - name: 'Linux AppImage (x86_64)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/leaf-desktop/${LEAF_VERSION}/${LINUX_ASSET_NAME}'

# Adds the Windows asset link to the already-created release, once a real
# Windows runner exists (see package:windows above for the same gate).
release:windows-asset:
  stage: release
  image: alpine:latest
  needs:
    - determine_version
    - package:windows
    - release
  rules:
    - if: '$CI_COMMIT_TAG && $WINDOWS_RUNNER_READY == "true"'
  script:
    - apk add --no-cache curl
    - |
      curl --fail --request POST --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        --data "name=Windows installer (amd64, .exe)" \
        --data "url=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/leaf-desktop/${LEAF_VERSION}/LEAF-Setup-amd64.exe" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"

# Adds the Windows arm64 asset link, same gate as package:windows:arm64.
release:windows-arm64-asset:
  stage: release
  image: alpine:latest
  needs:
    - determine_version
    - package:windows:arm64
    - release
  rules:
    - if: '$CI_COMMIT_TAG && $WINDOWS_ARM64_RUNNER_READY == "true"'
  script:
    - apk add --no-cache curl
    - |
      curl --fail --request POST --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        --data "name=Windows installer (arm64, .exe)" \
        --data "url=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/leaf-desktop/${LEAF_VERSION}/LEAF-Setup-arm64.exe" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"

# Adds the Linux arm64 asset link to the already-created release. Not in
# release's own `needs` (same reasoning as windows-asset above): a hiccup
# on this newer runner shouldn't hold back macOS/Linux-x86_64/Windows,
# which need no special runner setup and are ready sooner.
release:linux-arm64-asset:
  stage: release
  image: alpine:latest
  needs:
    - determine_version
    - package:linux:arm64
    - release
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - apk add --no-cache curl
    - |
      curl --fail --request POST --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        --data "name=Linux AppImage (aarch64)" \
        --data "url=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/leaf-desktop/${LEAF_VERSION}/${LINUX_ARM64_ASSET_NAME}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"

# Installers are big (five platforms x a bundled Python runtime), so keep only
# the newest patch per MAJOR.MINOR line: once `release` has gone out (i.e.
# macOS + Linux packaging actually succeeded for this tag), delete the
# leaf-desktop generic packages of every *other* version sharing this tag's
# MAJOR.MINOR. Other minor lines are left alone, so v0.10.x installers survive
# a v0.11.x release.
#
# Tags and GitLab Releases are deliberately NOT pruned -- every tag is now a
# release someone chose to cut, and deleting a tag takes its Release page with
# it. The tradeoff is that a superseded patch's Release page keeps asset links
# that 404; point people at the newest patch in that line.
#
# Runs after `release` rather than as part of `publish`: pruning only once the
# new installers exist means a packaging failure never leaves a minor line
# with no downloadable build at all. Only needs `release` itself (not the
# windows-gated release: jobs, which may not even exist in the pipeline) --
# same reasoning as `release`'s own needs above.
cleanup:old-installers:
  stage: release
  image: alpine:latest
  needs:
    - determine_version
    - release
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - apk add --no-cache curl jq
    - |
      major_minor="${LEAF_VERSION%.*}"
      echo "Keeping leaf-desktop ${LEAF_VERSION}; pruning other ${major_minor}.* installers."
      failed=0
      page=1
      while :; do
        packages=$(curl --silent --fail --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_name=leaf-desktop&per_page=100&page=${page}")
        count=$(echo "$packages" | jq 'length')
        [ "$count" -eq 0 ] && break
        # `for` over the id list, not `... | while read`: a piped while runs in
        # a subshell, so a failure recorded inside it would be lost when that
        # subshell exits. Package ids are bare integers, so word-splitting is
        # safe here.
        for pkg_id in $(echo "$packages" | jq -r --arg mm "${major_minor}." --arg cur "${LEAF_VERSION}" \
          '.[] | select(.version | startswith($mm)) | select(.version != $cur) | .id'); do
          echo "Deleting package id $pkg_id"
          # No `|| true` here. Swallowing the status made this job green while
          # deleting nothing: a 403 (GITLAB_TOKEN without the rights) printed
          # the line above and moved on, so packages accumulated unnoticed.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request DELETE --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${pkg_id}")
          # 404 is fine - already gone is the state we want.
          case "$code" in
            2*|404) ;;
            *) echo "  FAILED to delete package $pkg_id (HTTP $code)"; failed=1 ;;
          esac
        done
        page=$((page + 1))
      done

      if [ "$failed" -ne 0 ]; then
        echo "Pruning did not complete - see the FAILED lines above."
        echo "Most likely cause: GITLAB_TOKEN lacks package-delete rights."
        echo "Storage will keep growing until this is fixed, so this job fails"
        echo "rather than reporting success."
        exit 1
      fi
