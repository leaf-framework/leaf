EQUIPMENT_INSTANCES:
  - equipment:
      adapter: Example
      data:
        instance_id: demo_device
        organisation: university_lab
        department: research
      requirements:
        interval: 1

OUTPUTS:
    - plugin: mqtt
      broker: localhost
      port: 1883
# MQTT output requires 'broker' and 'port' 
# optionally 'username', 'password', 'clientid', 'protocol', 'transport', and 'tls'
# and optionally an alternative 'fallback' output
# Every output receives all data, except one named as another's fallback.
# Two outputs of the same plugin each need a 'name'; fallback can refer to it.
  # - plugin: FILE
  #   name: local
  #   filename: testing.json
  # - plugin: FILE
  #   name: share
  #   filename: /mnt/share/testing.json
#   username: None #OPTIONAL expects a str
#   password: None #OPTIONAL expects a str
#   clientid: None #OPTIONAL expects a str
#   protocol: v3   #OPTIONAL expects "v3" "v5"
#   transport: tcp #OPTIONAL expects "tcp", "websockets", "unix"
#   tls: False     #OPTIONAL expects True, False
#   fallback: FILE #OPTIONAL expects "SQL", "FILE"

# SQL output requires 'filename' of database 
# and optionally an alternative 'fallback' output
#  - plugin: SQL
#    filename: messages.db
#    fallback: FILE #OPTIONAL expects "MQTT", "FILE"

# FILE output requires 'filename'
# and optionally an alternative 'fallback' output
#  - plugin: FILE
#    filename: local.json
#    fallback: SQL #OPTIONAL expects "MQTT", "SQL"
