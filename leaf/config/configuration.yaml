EQUIPMENT_INSTANCES:
  - equipment:
      adapter: Example
      data:
        instance_id: demo_device
        organisation: university_lab
        department: research
      requirements:
        interval: 1

OUTPUTS:
    - plugin: mqtt
      broker: localhost
      port: 1883
