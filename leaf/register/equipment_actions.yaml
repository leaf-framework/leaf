details: <root>/<organisation>/<department>/<adapter_id>/<instance_id>/details
running: <root>/<organisation>/<department>/<adapter_id>/<instance_id>/running
heartbeat: <root>/<organisation>/<department>/<adapter_id>/<instance_id>/heartbeat
error: <root>/<organisation>/<department>/<adapter_id>/<instance_id>/error
control: <root>/<organisation>/<department>/<adapter_id>/<instance_id>/control
control_result: <root>/<organisation>/<department>/<adapter_id>/<instance_id>/control/result
# A run (experiment, batch, upload) starts and stops on the instance itself; its id is a point tag
start: <root>/<organisation>/<department>/<adapter_id>/<instance_id>/start
stop: <root>/<organisation>/<department>/<adapter_id>/<instance_id>/stop
# The entity is what a point is about: the instance itself, or something inside it such as a reactor
measurement: <root>/<organisation>/<department>/<adapter_id>/<instance_id>/measurement/<entity>/<measurement>
