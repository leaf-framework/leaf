- adapter_id: leaf_modbus
  image: icon:bi-hdd-network
  description: "A LEAF adapter for Modbus TCP devices. Polls configurable holding registers at a fixed interval and publishes measurements for monitoring and analysis."
  equipment_data:
    version: "0.1.0"
    manufacturer: Modbus
    device_type: Modbus TCP device
    application: Modbus Monitoring
    requirements:
      host: string          # Modbus TCP host address
      port: int             # Modbus TCP port (default 502)
      device_id: int        # Modbus unit/device ID (default 1)
      interval: int         # Polling interval in seconds
      registers:
        - name: temperature   # Key used in the output payload
          address: 40301      # Holding register address in 4xxxx notation
          scale: 0.01         # Optional: multiply raw value by this factor (default 1.0)
        - name: presence
          address: 40803
        - name: last_ir_ts
          address: 42002
          count: 2            # Optional: number of consecutive registers to read (default 1)
                              # Multi-register fields are stored as last_ir_ts_0, last_ir_ts_1, ...
  repo_url: https://gitlab.com/leaf-framework/leaf-adapters/leaf-modbus.git
  name: LEAF-Modbus