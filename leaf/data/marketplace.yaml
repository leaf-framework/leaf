  name: LEAF-Pioreactor

- adapter_id: OPC
  image: ./images/opcua.png
  description: "A LEAF adapter for the OPC sensor module. This plugin connects to OPC sensors to retrieve real-time monitoring data. It uses the topic subscription model to retrieve data in real-time."
  equipment_data:
    version: "1.0.0"
    manufacturer: OPC
    device_type: OPC sensor module
    application: OPC Monitoring
  requirements:
    port: int                   # OPC server port
    host: string                # OPC server host address
    topics: list[string]        # Optional: list of OPC node IDs to subscribe to
    exclude_topics: list[string] # Optional: list of OPC node IDs to exclude
    mapper:                     # Optional: tag mapping rules applied to each measurement
      - field: node             # Tag field to match against (e.g. "node")
        pattern: '^R1_.*'       # Regex pattern to match the field value
        tags:                   # Tags to add when the pattern matches
          entity: 9
      - field: node
        pattern: '^R2_.*'
        tags:
          entity: 10
  repo_url: https://gitlab.com/leaf-framework/leaf-adapters/leaf-opc-adapter.git
  name: LEAF OPC
